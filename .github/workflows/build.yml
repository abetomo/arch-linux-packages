name: Build
on:
  - push
  - pull_request
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image build
        run: docker image build -t groonga-archlinux .
      - name: Build package
        run: |
          docker container run --rm --shm-size 512mb \
          -v "${PWD}:/host" groonga-archlinux \
          bash -c "/host/setup.sh && /host/build.sh"
      - name: Test install
        run: |
          docker container run --rm \
          -v "${PWD}:/host" groonga-archlinux \
          bash -c "/host/setup.sh && sudo pacman --needed --noconfirm --upgrade /host/groonga-*.pkg.tar.zst && groonga --version"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: "*.pkg.tar.*"
